<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrixii</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>MATRIXII</h1>

  <!-- Source: where the video comes from -->
  <div class="bar">
    <button id="cam">Use webcam</button>
    <label class="file">Upload video<input id="file" type="file" accept="video/*"></label>
    <button id="rec" disabled>Record</button>
  </div>

  <!-- Look: how the filter draws it -->
  <div class="bar">
    <label>Style <select id="style"></select></label>
    <label>Cell size <input id="size" type="range" min="6" max="24" value="10"></label>
    <label>Rain <input id="rain" type="range" min="0" max="100" value="40"></label>
    <label>Contrast <input id="contrast" type="range" min="50" max="300" value="150"></label>
    <label><input id="invert" type="checkbox"> Invert</label>
    <label><input id="color" type="checkbox"> Original colors</label>
  </div>

  <canvas id="out" width="1280" height="720"></canvas>
  <div id="status">Pick a webcam or a video file. Everything runs on your computer; nothing is uploaded.</div>
  <video id="video" playsinline></video>

  <!-- Plain scripts (not modules) so the page also works when opened straight from disk. Order matters. -->
  <script src="js/styles.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
